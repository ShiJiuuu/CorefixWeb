<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>企业资讯 · 移动端</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FFFFFF; --bg2:#F4F4F1; --card:#FFFFFF;
    --ink:#0A0A0A; --ink2:#2E2E2C; --muted:#6E6E6A; --faint:#9C9C97;
    --line:rgba(10,10,10,.12); --line2:rgba(10,10,10,.28);
    --inv:#0A0A0A; --inv-t:#FFFFFF; --grid:rgba(10,10,10,.055);
    --cardbody:#0B0B0B; --paper2:#F4F4F1; --ghost:rgba(10,10,10,.14);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  html,body{background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .u-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .wrap{padding:64px 20px 56px}
  .head{border-bottom:1px solid var(--line2);padding-bottom:20px;margin-bottom:26px}
  .head h2{margin-top:12px;font-size:34px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
  .sub{margin-top:12px;font-size:13px;line-height:1.85;color:var(--muted)}
  .side{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}
  .meta{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--faint);white-space:nowrap}
  .u-link{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;
    letter-spacing:.12em;border-bottom:1px solid var(--line2);padding-bottom:6px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .u-link span{color:var(--faint)}

  .track{display:flex;gap:14px;overflow:hidden;padding-left:20px;margin-left:-20px}
  .ncard{position:relative;flex:none;width:330px;height:430px;overflow:hidden;border:1px solid var(--line2);
    border-radius:2px;background:var(--cardbody);color:#fff;text-decoration:none}
  .cover{position:absolute;left:0;top:0;width:100%;height:240px;overflow:hidden;background:#161614}
  .cover img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(.84)}
  .scrim{position:absolute;left:0;top:0;width:100%;height:240px;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,10,10,.5) 0%,rgba(10,10,10,.12) 32%,rgba(10,10,10,.38) 72%,var(--cardbody) 100%)}
  .top{position:absolute;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:flex-start}
  .cat{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.55);background:rgba(10,10,10,.42);backdrop-filter:blur(6px);padding:4px 7px;white-space:nowrap}
  .idx{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.6);padding-top:4px}
  .body{position:absolute;left:0;right:0;top:240px;bottom:0;padding:16px 18px 14px;display:flex;flex-direction:column;background:var(--cardbody)}
  .date{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:rgba(255,255,255,.55)}
  .date i{font-style:normal;color:rgba(255,255,255,.3);margin:0 6px}
  h3{margin-top:8px;font-size:18px;font-weight:600;line-height:1.45;letter-spacing:-.01em;color:#fff;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ex{margin-top:7px;font-size:11.5px;line-height:1.75;color:rgba(255,255,255,.6);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .foot{margin-top:auto;padding-top:11px;border-top:1px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:rgba(255,255,255,.8)}

  .ctrl{display:flex;align-items:center;gap:14px;margin-top:26px}
  .counter{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
  .counter b{color:var(--ink);font-weight:500;font-size:12px}
  .rail{position:relative;flex:1;height:1px;background:var(--line2)}
  .rail i{position:absolute;left:0;top:0;height:1px;width:7%;background:var(--ink)}
  .rail::after{content:"";position:absolute;left:7%;top:-2px;width:1px;height:5px;background:var(--ink)}
  .drag{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8.5px;
    letter-spacing:.14em;color:var(--faint);white-space:nowrap}
</style>
</head>
<body>
  <section class="wrap">
    <div class="head">
      <p class="u-label">NEWS</p>
      <h2>企业资讯</h2>
      <p class="sub">公司动态、交付现场与技术观察，来自「集培优」公众号。</p>
      <div class="side">
        <span class="meta mono">16 ARTICLES · UPDATED 2026.08.18</span>
        <a class="u-link" href="#news">全部资讯 <span>→</span></a>
      </div>
    </div>

    <div class="track">
      <a class="ncard" href="#">
        <div class="cover"><img src="../public/news/ai-training-efficiency/img-01.png" alt="" /></div>
        <div class="scrim"></div>
        <div class="top"><span class="cat">行业观察</span><span class="idx">01</span></div>
        <div class="body">
          <p class="date">2026.08.18<i>·</i>9 MIN READ</p>
          <h3>GPU 越来越多，为什么 AI 训练效率没有同步提升？</h3>
          <p class="ex">某互联网企业把 AI 集群从 80 卡扩到 300 多卡，速度没有同步提升。</p>
          <div class="foot"><span>阅读全文</span><span>→</span></div>
        </div>
      </a>

      <a class="ncard" href="#">
        <div class="cover"><img src="../public/news/ecc-repairable/img-02.png" alt="" /></div>
        <div class="scrim"></div>
        <div class="top"><span class="cat">技术讲座</span><span class="idx">02</span></div>
        <div class="body">
          <p class="date">2026.07.31<i>·</i>6 MIN READ</p>
          <h3>GPU维修系列讲座｜认知篇：ECC能不能修？</h3>
          <p class="ex">ECC 不是可以直接「修」的故障件，需要先归因、再决策。</p>
          <div class="foot"><span>阅读全文</span><span>→</span></div>
        </div>
      </a>
    </div>

    <div class="ctrl">
      <span class="counter"><b>01</b> / 16</span>
      <div class="rail"><i></i></div>
      <span class="drag">↔ 拖动</span>
    </div>
  </section>
</body>
</html>
