<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>NVIDIA HGX B300 — Exploded Teardown</title>
<style>
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; background:#000; overflow:hidden; }
  body{ display:grid; place-items:center; }
  #stage{
    position:relative; width:1920px; height:1080px; background:#000;
    transform-origin:center center; overflow:hidden;
  }
  #cv{ position:absolute; inset:0; width:1920px; height:1080px; display:block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
</div>

<script>
(() => {
  'use strict';

  const W = 1920, H = 1080;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha: false });

  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20261106);

  const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
  const smooth  = x => { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); };
  const easeIO  = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const lerp    = (a, b, t) => a + (b - a) * t;

  /* ============================================================
     Real envelope (NVIDIA DGX / HGX B300 system spec sheet)
       H x W x L : 442 x 482.6 x 904.2 mm  ->  10 RU
       this scene : 2.40 x 2.62 x 4.91 units (1 unit ~ 184 mm)
       8 x B300 SXM (2.1 TB HBM3e) | 2 x Xeon 6776P
       2 x NVLink 5 switch trays | 8 x ConnectX-8 | 8 x E1.S
       12 x 3.2 kW PSU | ~14.5 kW  |  liquid cooled
     ============================================================ */
  const CH_W = 2.62, CH_H = 2.40, CH_D = 4.91;
  const BOARD_Y = -0.42;

  const GX = [-0.90, -0.30, 0.30, 0.90];
  const GZ = [-0.31, 0.31];          // centred grid offsets; tray sits at z = -1.41
  const GPU_TRAY_Z = -1.41;

  const K_PKG = 0.295;
  const K_CPU = 0.55;
  const K_SW  = 0.70;
  const K_NIC = 0.44;

  function boxEdges(w, h, d, step){
    const out = [];
    const hx = w/2, hy = h/2, hz = d/2;
    for (const y of [-hy, hy]) for (const z of [-hz, hz])
      for (let x = -hx; x <= hx + 1e-6; x += step) out.push([x, y, z]);
    for (const x of [-hx, hx]) for (const z of [-hz, hz])
      for (let y = -hy; y <= hy + 1e-6; y += step) out.push([x, y, z]);
    for (const x of [-hx, hx]) for (const y of [-hy, hy])
      for (let z = -hz; z <= hz + 1e-6; z += step) out.push([x, y, z]);
    return out;
  }
  const bottomOf = pts => {
    let m = Infinity;
    for (const p of pts) m = Math.min(m, p.p[1] - p.s * 0.5);
    return m;
  };
  // scale into final units, drop the origin onto y = 0 so parts seat together
  function scaled(pts, k, dy, sizeK){
    const sk = sizeK === undefined ? 3.0 : sizeK;
    return pts.map(p => ({
      p: [p.p[0] * k, (p.p[1] + dy) * k, p.p[2] * k],
      s: Math.min(0.0075, Math.max(0.0020, p.s * k * sk)),
      a: p.a,
    }));
  }

  /* ---------- one B300 SXM module (unscaled, 1.90 square) ---------- */
  function b300Package(){
    const pts = [];
    for (const p of boxEdges(1.90, 0.10, 1.90, 0.030)) pts.push({p, s:0.0074, a:0.46});
    for (let x=-0.80; x<=0.80; x+=0.100)
      for (let z=-0.80; z<=0.80; z+=0.100)
        pts.push({p:[x, -0.056, z], s:0.0040, a:0.20});
    // two reticle-sized dies
    for (const dx of [-0.44, 0.44]){
      for (const p of boxEdges(0.80, 0.075, 0.80, 0.014))
        pts.push({p:[dx + p[0], 0.085 + p[1], p[2]], s:0.0096, a:1.00});
      for (let gx=0; gx<8; gx++)
        for (let gz=0; gz<8; gz++){
          const cxp = dx - 0.315 + gx*0.090;
          const czp = -0.315 + gz*0.090;
          pts.push({p:[cxp, 0.124, czp], s:0.0044, a:0.32});
          pts.push({p:[cxp, 0.124, czp + 0.06], s:0.0040, a:0.22});
        }
    }
    // NV-HBI die-to-die bridge
    for (const p of boxEdges(0.11, 0.05, 0.56, 0.012)) pts.push({p:[p[0], 0.085 + p[1], p[2]], s:0.0070, a:0.88});
    for (let z=-0.26; z<=0.26; z+=0.018)
      pts.push({p:[0, 0.116, z], s:0.0052, a:0.64});
    // empty HBM landings, so a lifted stack still reads as "socketed"
    for (const dx of [-0.48, 0.48])
      for (let k=0; k<3; k++)
        for (const dz of [-0.66, 0.66]){
          const sx = dx - 0.30 + k*0.30;
          for (const p of boxEdges(0.25, 0.002, 0.23, 0.058))
            pts.push({p:[sx + p[0], 0.052, dz + p[2]], s:0.0044, a:0.24});
        }
    return pts;
  }

  /* ---------- 12 x HBM3e 12-Hi stacks (same frame as the package) ---------- */
  function hbmStacks(){
    const pts = [];
    const centres = [];
    for (const dx of [-0.48, 0.48])
      for (let k=0; k<3; k++)
        for (const dz of [-0.66, 0.66])
          centres.push([dx - 0.30 + k*0.30, dz]);
    const HW = 0.117, HD = 0.107;
    for (const [sx, sz] of centres){
      for (const p of boxEdges(0.250, 0.030, 0.230, 0.024))
        pts.push({p:[sx + p[0], 0.065 + p[1], sz + p[2]], s:0.0066, a:0.86});
      for (let l=0; l<12; l++){
        const y = 0.083 + l*0.0170;
        for (let x=-HW; x<=HW+1e-6; x+=0.026)
          pts.push({p:[sx + x, y, sz + HD], s:0.0054, a:0.62});
        for (let z=-HD; z<=HD+1e-6; z+=0.028)
          pts.push({p:[sx + HW, y, sz + z], s:0.0054, a:0.48});
      }
      for (const [cx, cz] of [[-HW,-HD],[HW,-HD],[-HW,HD],[HW,HD]])
        for (let y=0.078; y<=0.286; y+=0.014)
          pts.push({p:[sx + cx, y, sz + cz], s:0.0044, a:0.44});
    }
    return pts;
  }

  /* ---------- coarse HBM stand-in for the 7 non-hero packages ---------- */
  function hbmSimple(){
    const pts = [];
    const centres = [];
    for (const dx of [-0.48, 0.48])
      for (let k=0; k<3; k++)
        for (const dz of [-0.66, 0.66])
          centres.push([dx - 0.30 + k*0.30, dz]);
    for (const [sx, sz] of centres){
      for (const p of boxEdges(0.24, 0.21, 0.22, 0.060))
        pts.push({p:[sx + p[0], 0.185 + p[1], sz + p[2]], s:0.0058, a:0.56});
      for (let l=0; l<4; l++)
        for (let x=-0.11; x<=0.11; x+=0.055)
          pts.push({p:[sx + x, 0.098 + l*0.048, sz + 0.11], s:0.0050, a:0.42});
    }
    return pts;
  }

  /* ---------- liquid cold plate (same frame as the package) ---------- */
  function coldPlate(){
    const pts = [];
    for (const p of boxEdges(1.90, 0.14, 1.90, 0.028)) pts.push({p:[p[0], 0.37 + p[1], p[2]], s:0.0080, a:0.60});
    const runs = 5, pitch = 0.28;
    for (let r=0; r<runs; r++){
      const z = -0.56 + r*pitch;
      for (const dz of [-0.036, 0.036])
        for (let x=-0.62; x<=0.62; x+=0.042)
          pts.push({p:[x, 0.445, z + dz], s:0.0058, a:0.62});
      if (r < runs-1){
        const xend = (r % 2 === 0) ? 0.62 : -0.62;
        for (const dx of [-0.036, 0.036])
          for (let zz=z; zz<=z+pitch+1e-6; zz+=0.040)
            pts.push({p:[xend + dx, 0.445, zz], s:0.0058, a:0.62});
      }
    }
    for (const [px, pz] of [[-0.78,-0.78],[-0.78,0.78]]){
      for (let a=0; a<Math.PI*2; a+=0.16)
        pts.push({p:[px + Math.cos(a)*0.11, 0.50, pz + Math.sin(a)*0.11], s:0.0060, a:0.75});
      for (const p of boxEdges(0.18, 0.15, 0.18, 0.016))
        pts.push({p:[px + p[0], 0.53 + p[1], pz + p[2]], s:0.0065, a:0.66});
    }
    for (const [px, pz] of [[-0.86,-0.86],[0.86,-0.86],[-0.86,0.86],[0.86,0.86]])
      for (let a=0; a<Math.PI*2; a+=0.25)
        pts.push({p:[px + Math.cos(a)*0.045, 0.445, pz + Math.sin(a)*0.045], s:0.0050, a:0.62});
    return pts;
  }

  /* ---------- Xeon 6776P socket + 12 DDR5 DIMM slots ---------- */
  function xeonCpu(){
    const pts = [];
    for (const p of boxEdges(0.92, 0.09, 0.92, 0.024)) pts.push({p, s:0.0076, a:0.52});
    for (const p of boxEdges(0.60, 0.065, 0.60, 0.016)) pts.push({p:[p[0], 0.077 + p[1], p[2]], s:0.0092, a:0.97});
    for (let gx=0; gx<6; gx++)
      for (let gz=0; gz<6; gz++){
        const x = -0.21 + gx*0.084;
        const z = -0.21 + gz*0.084;
        pts.push({p:[x, 0.113, z], s:0.0044, a:0.26});
      }
    for (const side of [-1, 1])
      for (let k=0; k<6; k++){
        const z = -0.50 + k*0.20;
        for (const p of boxEdges(0.055, 0.13, 0.15, 0.014))
          pts.push({p:[side*0.57 + p[0], 0.075 + p[1], z + p[2]], s:0.0062, a:0.70});
      }
    for (const p of boxEdges(0.64, 0.035, 0.64, 0.024)) pts.push({p:[p[0], 0.14 + p[1], p[2]], s:0.0072, a:0.52});
    return pts;
  }

  /* ---------- NVLink 5 switch package, 18 links ---------- */
  function nvlinkSwitch(){
    const pts = [];
    for (const p of boxEdges(0.78, 0.09, 0.78, 0.020)) pts.push({p, s:0.0076, a:0.54});
    for (const p of boxEdges(0.46, 0.06, 0.46, 0.014)) pts.push({p:[p[0], 0.075 + p[1], p[2]], s:0.0090, a:0.97});
    for (let l=0; l<7; l++){
      const x = -0.18 + l*0.06;
      for (let z=-0.18; z<=0.18; z+=0.035) pts.push({p:[x, 0.108, z], s:0.0044, a:0.30});
    }
    for (const side of [-1, 1])
      for (let k=0; k<9; k++){
        const x = -0.32 + k*0.08;
        for (const p of boxEdges(0.045, 0.035, 0.05, 0.012))
          pts.push({p:[x + p[0], 0.045 + p[1], side*0.365 + p[2]], s:0.0058, a:0.78});
      }
    return pts;
  }

  /* ---------- ConnectX-8 card: 800G ASIC + OSFP cages ---------- */
  function connectX8(){
    const pts = [];
    for (const p of boxEdges(0.92, 0.045, 0.34, 0.016)) pts.push({p, s:0.0078, a:0.62});
    for (let x=-0.34; x<=0.16; x+=0.014)
      for (let z=-0.01; z<=0.01; z+=0.012)
        pts.push({p:[x, -0.026, -0.12 + z], s:0.0048, a:0.92});
    for (const cx of [-0.18, 0.18]){
      for (const p of boxEdges(0.15, 0.035, 0.15, 0.012)) pts.push({p:[cx + p[0], 0.04 + p[1], p[2]], s:0.0076, a:0.94});
      for (let gx=0; gx<3; gx++)
        for (let gz=0; gz<3; gz++)
          pts.push({p:[cx - 0.04 + gx*0.04, 0.06, -0.04 + gz*0.04], s:0.0042, a:0.30});
    }
    for (const cx of [-0.34, 0.34]){
      for (const p of boxEdges(0.12, 0.11, 0.19, 0.016)) pts.push({p:[cx + p[0], 0.04 + p[1], p[2]], s:0.0064, a:0.74});
      for (const p of boxEdges(0.09, 0.07, 0.10, 0.014)) pts.push({p:[cx + p[0], 0.04 + p[1], 0.10 + p[2]], s:0.0054, a:0.56});
    }
    for (const p of boxEdges(0.02, 0.20, 0.34, 0.016)) pts.push({p:[-0.46 + p[0], 0.05 + p[1], p[2]], s:0.0062, a:0.66});
    return pts;
  }

  /* ---------- the 10U chassis itself (static frame) ---------- */
  function chassisPoints(){
    const pts = [];
    for (const p of boxEdges(CH_W, CH_H, CH_D, 0.040)) pts.push({p, s:0.0082, a:0.40});

    // baseboard
    for (const p of boxEdges(2.42, 0.03, 4.54, 0.055))
      pts.push({p:[p[0], BOARD_Y - 0.015 + p[1], p[2]], s:0.0056, a:0.30});
    for (let z=-2.20; z<=2.20; z+=0.072)
      for (let x=-1.16; x<=1.16; x+=0.072){
        if (rnd() < 0.70) continue;
        pts.push({p:[x, BOARD_Y + 0.002, z], s:0.0042, a:0.16});
      }

    // front I/O strip
    const fz = CH_D/2 - 0.024;
    // 8 x E1.S cache drives
    for (let k=0; k<8; k++){
      const x = -0.98 + k*0.28;
      for (const p of boxEdges(0.24, 0.17, 0.02, 0.014))
        pts.push({p:[x + p[0], 0.52 + p[1], fz + p[2]], s:0.0058, a:0.66});
      for (const p of boxEdges(0.05, 0.05, 0.02, 0.014))
        pts.push({p:[x - 0.06 + p[0], 0.52 + p[1], fz + p[2]], s:0.0044, a:0.34});
    }
    // 8 x OSFP cages (ConnectX-8 bring-out, moved to the front on B300)
    for (let k=0; k<8; k++){
      const x = -1.02 + k*0.29;
      for (const p of boxEdges(0.23, 0.11, 0.03, 0.014))
        pts.push({p:[x + p[0], 0.92 + p[1], fz + p[2]], s:0.0058, a:0.72});
    }
    // 6 visible PSU handles of the 12 x 3.2 kW N+N feed
    for (let k=0; k<6; k++){
      const x = -0.90 + k*0.36;
      for (const p of boxEdges(0.31, 0.30, 0.02, 0.016))
        pts.push({p:[x + p[0], -0.62 + p[1], fz + p[2]], s:0.0058, a:0.58});
      for (let v=0; v<4; v++)
        pts.push({p:[x - 0.10 + v*0.065, -0.62, fz + 0.012], s:0.0042, a:0.26});
    }
    // power / ID / fault buttons
    for (const p of boxEdges(0.10, 0.10, 0.02, 0.012))
      pts.push({p:[1.16 + p[0], 0.52 + p[1], fz + p[2]], s:0.0064, a:0.86});
    for (const p of boxEdges(0.06, 0.06, 0.02, 0.012))
      pts.push({p:[1.00 + p[0], 0.52 + p[1], fz + p[2]], s:0.0052, a:0.54});

    // rear: fan wall + 8 OSFP
    const rz = -CH_D/2 + 0.024;
    for (let k=0; k<8; k++){
      const x = -0.96 + k*0.27;
      for (const p of boxEdges(0.20, 0.10, 0.02, 0.014))
        pts.push({p:[x + p[0], 0.34 + p[1], rz + p[2]], s:0.0054, a:0.50});
    }
    for (let k=0; k<12; k++){
      const x = -1.05 + k*0.19;
      for (let a=0; a<Math.PI*2; a+=0.42)
        pts.push({p:[x + Math.cos(a)*0.055, -1.00 + Math.sin(a)*0.055, rz], s:0.0044, a:0.40});
    }

    // liquid supply / return running the length of the tray
    for (const mx of [-1.28, 1.28])
      for (const my of [0.62, 0.69])
        for (let z=-2.40; z<=2.40; z+=0.034)
          pts.push({p:[mx, my, z], s:0.0052, a:0.56});
    for (const dx of GX)
      for (const dy of [0.36, 0.46, 0.56])
        pts.push({p:[dx, dy, -2.15], s:0.0048, a:0.46});

    return pts;
  }

  /* ============================================================
     assemble the particle soup
     ============================================================ */
  const pkgRaw = b300Package();
  const PKG_DY = -bottomOf(pkgRaw);
  const PKG = scaled(pkgRaw, K_PKG, PKG_DY);
  const HBM = scaled(hbmStacks(), K_PKG, PKG_DY);
  const HBM_LO = scaled(hbmSimple(), K_PKG, PKG_DY);
  const PLATE = scaled(coldPlate(), K_PKG, PKG_DY);

  const cpuRaw = xeonCpu();
  const CPU = scaled(cpuRaw, K_CPU, -bottomOf(cpuRaw));
  const swRaw = nvlinkSwitch();
  const SW = scaled(swRaw, K_SW, -bottomOf(swRaw));
  const nicRaw = connectX8();
  const NIC = scaled(nicRaw, K_NIC, -bottomOf(nicRaw));

  const COMPONENTS = [
    { a:[0, BOARD_Y, GPU_TRAY_Z],       e:[-2.35, 1.55,  1.55] },  // GPU tray
    { a:[GX[0], BOARD_Y, GPU_TRAY_Z + GZ[1]], e:[-2.05, 2.68, -0.78] },  // HBM stacks
    { a:[0, BOARD_Y, GPU_TRAY_Z],       e:[ 0.34, 2.58, -1.35] },  // cold plates
    { a:[0, BOARD_Y, 0.58],             e:[-2.30,-1.72, -1.70] },  // Xeon + DDR5
    { a:[0, BOARD_Y,-0.30],             e:[ 2.40, 1.42,  1.45] },  // NVLink switch
    { a:[0, BOARD_Y, 1.63],             e:[ 2.45,-1.58, -1.45] },  // ConnectX-8
  ];
  const NC = COMPONENTS.length;
  const ASSEMBLED = COMPONENTS.map(c => c.a);
  const EXPLODED  = COMPONENTS.map(c => c.e);

  const ox = [], oy = [], oz = [];
  const ex = [], ey = [], ez = [];
  const sx = [], sy = [], sz = [];
  const bx = [], by = [], bz = [];
  const size = [], alpha = [], delay = [], phase = [], isFrame = [], modIdx = [];

  function scatterPoint(){
    const r = 6 + rnd() * 5.5;
    const th = rnd() * Math.PI * 2;
    const ph = (rnd() - 0.5) * Math.PI;
    return [
      Math.cos(th) * Math.cos(ph) * r,
      Math.sin(ph) * r * 0.62,
      Math.sin(th) * Math.cos(ph) * r * 0.50,
    ];
  }

  function addParticle(local, mi, s, a, frame){
    const A = frame ? [local[0], local[1], local[2]] : ASSEMBLED[mi].map((v, i) => v + local[i]);
    const E = frame ? [local[0], local[1], local[2]] : EXPLODED[mi].map((v, i) => v + local[i]);
    ox.push(A[0]); oy.push(A[1]); oz.push(A[2]);
    ex.push(E[0]); ey.push(E[1]); ez.push(E[2]);
    const sc = scatterPoint();
    sx.push(sc[0]); sy.push(sc[1]); sz.push(sc[2]);
    let dx = local[0], dy = local[1], dz = local[2];
    const len = Math.hypot(dx, dy, dz) || 1;
    dx = dx / len + (rnd() - 0.5) * 0.9;
    dy = dy / len + (rnd() - 0.5) * 0.9;
    dz = dz / len + (rnd() - 0.5) * 0.9;
    const l2 = Math.hypot(dx, dy, dz) || 1;
    bx.push(dx / l2); by.push(dy / l2); bz.push(dz / l2);
    size.push(s); alpha.push(a);
    delay.push(rnd() * 0.45);
    phase.push(rnd() * Math.PI * 2);
    isFrame.push(frame ? 1 : 0);
    modIdx.push(frame ? -1 : mi);
  }

  // chassis
  chassisPoints().forEach(p => addParticle(p.p, -1, p.s, p.a, true));

  // 0 — eight B300 packages, hero (left-front) keeps its HBM slot empty
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 2; r++){
      const hero = (c === 0 && r === 1);
      for (const p of PKG) addParticle([GX[c] + p.p[0], p.p[1], GZ[r] + p.p[2]], 0, p.s, p.a, false);
      if (!hero) for (const p of HBM_LO) addParticle([GX[c] + p.p[0], p.p[1], GZ[r] + p.p[2]], 0, p.s, p.a, false);
    }

  // 1 — the 12 HBM stacks of the hero GPU
  for (const p of HBM) addParticle(p.p, 1, p.s, p.a, false);

  // 2 — eight cold plates, lifted as one plate array
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 2; r++)
      for (const p of PLATE) addParticle([GX[c] + p.p[0], p.p[1], GZ[r] + p.p[2]], 2, p.s, p.a, false);

  // 3 — two Xeon 6776P sockets
  for (const z of [-0.36, 0.36])
    for (const p of CPU) addParticle([p.p[0], p.p[1], z + p.p[2]], 3, p.s, p.a, false);

  // 4 — two NVLink 5 switches
  for (const x of [-0.42, 0.42])
    for (const p of SW) addParticle([x + p.p[0], p.p[1], p.p[2]], 4, p.s, p.a, false);

  // 5 — eight ConnectX-8 cards, two ranks of four
  for (let r = 0; r < 2; r++)
    for (let c = 0; c < 4; c++)
      for (const p of NIC) addParticle([-0.66 + c*0.44 + p.p[0], p.p[1], (r - 0.5)*0.42 + p.p[2]], 5, p.s, p.a, false);

  const N = ox.length;
  const OX = Float32Array.from(ox), OY = Float32Array.from(oy), OZ = Float32Array.from(oz);
  const EX = Float32Array.from(ex), EY = Float32Array.from(ey), EZ = Float32Array.from(ez);
  const SX = Float32Array.from(sx), SY = Float32Array.from(sy), SZ = Float32Array.from(sz);
  const BX = Float32Array.from(bx), BY = Float32Array.from(by), BZ = Float32Array.from(bz);
  const PS = Float32Array.from(size), AL = Float32Array.from(alpha);
  const DL = Float32Array.from(delay), PH = Float32Array.from(phase);
  const FR = Uint8Array.from(isFrame), MI = Int8Array.from(modIdx);

  /* ============================================================
     timeline — 15 s, six modules
     ============================================================ */
  const TL = {
    assemble0: 0.10, assembleDur: 1.10,
    explode0: 1.90,  explodeDur: 1.00,
    cam0: 4.25, per: 1.38, hold: 0.98,
    reassemble0: 12.13, reassembleDur: 1.25,
    end: 15.00,
  };
  const LAST_MODULE_END = TL.cam0 + (NC - 1) * TL.per + TL.hold;   // 12.13

  const CAM = [];
  const K = (t, eye, tgt, cx, cy) => CAM.push({ t, eye, tgt, f: 2600, cx, cy: cy === undefined ? 540 : cy });

  K(0.00, [2.00, 3.82, 13.62], [0.00, -0.35, 0], 1012, 540);
  K(1.20, [2.08, 3.92, 13.42], [0.00, -0.34, 0], 1012, 540);
  K(1.90, [2.02, 3.84, 13.55], [0.00, -0.30, 0], 1010, 545);
  K(2.90, [1.72, 2.95, 14.25], [0.00, 0.28, 0], 984, 600);
  K(3.90, [1.66, 2.86, 14.45], [0.00, 0.30, 0], 980, 608);

  const CAM_DIST = [4.75, 1.30, 5.60, 3.30, 3.40, 3.85];
  const CAM_VIEW = [
    [0.00, 0.86, 1.00],
    [0.00, 0.48, 1.00],
    [0.00, 0.76, 1.00],
    [0.00, 0.72, 1.00],
    [0.06, 0.74, 1.00],
    [0.13, 0.56, 1.00],
  ];
  for (let i = 0; i < NC; i++){
    const p = EXPLODED[i];
    const d = CAM_DIST[i];
    const v = CAM_VIEW[i];
    const vl = Math.hypot(v[0], v[1], v[2]);
    const hs = TL.cam0 + i * TL.per;
    const he = hs + TL.hold;
    K(hs, [p[0] + v[0]/vl*d, p[1] + v[1]/vl*d, p[2] + v[2]/vl*d], p, 1000);
    K(he, [p[0] + v[0]/vl*d*0.955, p[1] + v[1]/vl*d*0.955, p[2] + v[2]/vl*d*0.955], p, 1000);
  }
  K(12.75, [1.66, 2.86, 14.45], [0.00, 0.30, 0], 980, 608);
  K(13.75, [2.02, 3.84, 13.55], [0.00, -0.32, 0], 1012, 540);
  K(15.00, [2.12, 3.98, 13.30], [0.00, -0.32, 0], 1012, 540);

  function camAt(t){
    let i = 0;
    while (i < CAM.length - 1 && t > CAM[i + 1].t) i++;
    const a = CAM[i], b = CAM[i + 1] || a;
    const u = b.t > a.t ? clamp01((t - a.t) / (b.t - a.t)) : 1;
    const e = easeIO(u);
    return {
      eye: [lerp(a.eye[0], b.eye[0], e), lerp(a.eye[1], b.eye[1], e), lerp(a.eye[2], b.eye[2], e)],
      tgt: [lerp(a.tgt[0], b.tgt[0], e), lerp(a.tgt[1], b.tgt[1], e), lerp(a.tgt[2], b.tgt[2], e)],
      f: lerp(a.f, b.f, e), cx: lerp(a.cx, b.cx, e), cy: lerp(a.cy, b.cy, e),
    };
  }

  /* ============================================================
     render
     ============================================================ */
  const BUCKETS = 7;
  const countB = new Int32Array(BUCKETS);
  const startB = new Int32Array(BUCKETS + 1);
  const cursorB = new Int32Array(BUCKETS);
  const sX = new Float32Array(N), sY = new Float32Array(N), sS = new Float32Array(N);
  const bIdx = new Uint8Array(N);
  const order = new Int32Array(N);

  function render(t){
    const cam = camAt(t);
    const ex0 = cam.eye[0], ey0 = cam.eye[1], ez0 = cam.eye[2];
    let fx = cam.tgt[0] - ex0, fy = cam.tgt[1] - ey0, fz = cam.tgt[2] - ez0;
    const fl = Math.hypot(fx, fy, fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;
    let rx = -fz, ry = 0, rz = fx;
    const rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; ry /= rl; rz /= rl;
    const ux = ry*fz - rz*fy, uy = rz*fx - rx*fz, uz = rx*fy - ry*fx;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';

    const eRaw = clamp01((t - TL.explode0) / TL.explodeDur);
    const rRaw = clamp01((t - TL.reassemble0) / TL.reassembleDur);
    const camF = cam.f, camCX = cam.cx, camCY = cam.cy;

    countB.fill(0);
    let m = 0;

    for (let i = 0; i < N; i++){
      const d = DL[i];
      const ap = smooth(clamp01((t - (TL.assemble0 + d * 0.55)) / TL.assembleDur));
      const eP = smooth(clamp01(eRaw * 1.16 - d * 0.20));
      const rP = smooth(clamp01(rRaw * 1.16 - d * 0.20));
      let ef = eP - rP;
      if (ef < 0) ef = 0; else if (ef > 1) ef = 1;

      const frame = FR[i];
      const burstAmp = (frame ? 0.10 : 0.26) *
        (Math.sin(Math.PI * eP) * (1 - rP) + Math.sin(Math.PI * rP) * 0.55);

      const bxp = OX[i] + (EX[i] - OX[i]) * ef;
      const byp = OY[i] + (EY[i] - OY[i]) * ef;
      const bzp = OZ[i] + (EZ[i] - OZ[i]) * ef;
      const burst = burstAmp * (frame ? 0.4 : 1);

      let wx = SX[i] + (bxp - SX[i]) * ap + BX[i] * burst;
      let wy = SY[i] + (byp - SY[i]) * ap + BY[i] * burst;
      let wz = SZ[i] + (bzp - SZ[i]) * ap + BZ[i] * burst;

      const ph = PH[i];
      wx += Math.sin(t * 0.85 + ph) * 0.006 * ap;
      wy += Math.cos(t * 1.05 + ph) * 0.006 * ap;

      const dx = wx - ex0, dy = wy - ey0, dz = wz - ez0;
      const zc = dx*fx + dy*fy + dz*fz;
      if (zc < 0.6) continue;
      const xc = dx*rx + dy*ry + dz*rz;
      const yc = dx*ux + dy*uy + dz*uz;
      const invZ = 1 / zc;
      const px = camCX + camF * xc * invZ;
      const py = camCY - camF * yc * invZ;
      if (px < -48 || px > W + 48 || py < -48 || py > H + 48) continue;

      let a = AL[i] * (1.20 - 0.046 * (zc - 8));
      if (frame) a *= (1 - 0.85 * ef);
      if (t >= TL.cam0 && t < LAST_MODULE_END){
        const focused = Math.min(NC - 1, Math.floor((t - TL.cam0) / TL.per));
        if (frame) a *= 0.42;
        else if (MI[i] >= 0 && MI[i] !== focused) a *= 0.15;
      }
      a *= (0.32 + 0.68 * ap) * smooth(clamp01(t / 0.34));
      a *= 1.10;
      if (a > 1) a = 1;
      if (a <= 0.015) continue;

      let sz = PS[i] * camF * invZ;
      if (sz < 1.0) sz = 1.0; else if (sz > 4.8) sz = 4.8;

      let b = (a * BUCKETS) | 0;
      if (b > BUCKETS - 1) b = BUCKETS - 1;
      if (b < 0) b = 0;

      sX[m] = px; sY[m] = py; sS[m] = sz; bIdx[m] = b;
      countB[b]++;
      m++;
    }

    startB[0] = 0;
    for (let b = 1; b <= BUCKETS; b++) startB[b] = startB[b - 1] + countB[b - 1];
    for (let b = 0; b < BUCKETS; b++) cursorB[b] = startB[b];
    for (let k = 0; k < m; k++) order[cursorB[bIdx[k]]++] = k;

    for (let b = 0; b < BUCKETS; b++){
      const c = countB[b];
      if (!c) continue;
      const a = (b + 0.55) / BUCKETS;
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      const s0 = startB[b];
      for (let k = 0; k < c; k++){
        const idx = order[s0 + k];
        const sz = sS[idx];
        ctx.rect(sX[idx] - sz * 0.5, sY[idx] - sz * 0.5, sz, sz);
      }
      ctx.fill();
    }
  }

  /* ============================================================
     playback / seek
     ============================================================ */
  const params = new URLSearchParams(location.search);
  const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
  const still = params.has('still');

  window.__seek = (t) => { render(t); };
  window.__dbg = (t) => {
    const cam = camAt(t);
    const m0 = { minX: 1e9, maxX: -1e9, minY: 1e9, maxY: -1e9, minZ: 1e9, maxZ: -1e9 };
    for (let i = 0; i < N; i++){
      if (MI[i] !== 0) continue;
      m0.minX = Math.min(m0.minX, EX[i]); m0.maxX = Math.max(m0.maxX, EX[i]);
      m0.minY = Math.min(m0.minY, EY[i]); m0.maxY = Math.max(m0.maxY, EY[i]);
      m0.minZ = Math.min(m0.minZ, EZ[i]); m0.maxZ = Math.max(m0.maxZ, EZ[i]);
    }
    return { cam, m0, n: N, mods: EXPLODED };
  };

  function fit(){
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (fixedT !== null){
    render(fixedT);
  } else if (still || reduce){
    render(1.0);
  } else {
    const t0 = performance.now();
    const loop = (now) => {
      const t = ((now - t0) / 1000) % (TL.end + 0.8);
      render(t > TL.end ? TL.end : t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  window.__ready = true;
})();
</script>
</body>
</html>
